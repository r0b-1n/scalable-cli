[package]
name = "scalable-desktop"
version = "1.0.0"
description = "Scalable Capital Desktop"
authors = ["Scalable Capital"]
edition = "2021"

[lib]
name = "scalable_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
